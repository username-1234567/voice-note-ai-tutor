<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- 放开 maximum-scale：正文随系统字号缩放（textZoom）后，用户还应能双指放大细看 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex.min.css">
<script src="markdown-it.min.js"></script>
<script src="katex.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow-x: hidden; }
  body {
    /* 与原生正文同源：Roboto/MiSans/HarmonyOS 按厂商命中，-apple-system 是 iOS 专属、Android 永不命中 */
    font-family: "MiSans", "HarmonyOS Sans", "Noto Sans CJK SC", sans-serif;
    font-size: 14px; line-height: 1.75; word-break: break-word; overflow-wrap: break-word;
    padding: 0 2px;
  }
  /* 正文色 = Theme.kt 的 onSurface（浅 #141A26 / 深 #E3E6EE，冷灰蓝）。
     之前是 DeepSeek 观感的暖灰（#3A3630/#E4E2DE），和原生文字放在一起能看到两种"灰" */
  body.dark { color: #E3E6EE; }
  body.light { color: #141A26; }
  /* 自测题的选项是「可点的链接」：原生侧接住 #opt:X，不真跳转 */
  a { color: #3B5BA5; text-decoration: none; }
  body.dark a { color: #AEC0F5; }
  p { margin: 0.4em 0; }
  h1, h2, h3, h4, h5, h6 { margin: 0.8em 0 0.4em; line-height: 1.4; }
  h1 { font-size: 1.32em; }
  h2 { font-size: 1.2em; }
  h3 { font-size: 1.08em; }
  h4, h5, h6 { font-size: 1em; }
  pre {
    background: rgba(127,127,127,0.14); border-radius: 8px; padding: 10px 12px;
    /* 代码长行必须折行：手机上横向滚动几乎没人用，而 overflow 又会把
       整个 WebView 撑宽，右侧内容直接被裁掉。
       width/box-sizing 是必须的：只写 white-space: pre-wrap 时 pre 仍会
       被最长的不可断片段撑开，背景直接顶出屏幕 */
    box-sizing: border-box; width: 100%; max-width: 100%;
    white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;
    overflow-x: hidden; font-size: 13px; line-height: 1.5;
  }
  code { background: rgba(127,127,127,0.16); border-radius: 4px; padding: 1px 5px; font-size: 13px; overflow-wrap: anywhere; }
  pre code { background: transparent; padding: 0; }
  table {
    border-collapse: collapse; margin: 0.6em 0;
    display: block; overflow-x: auto; max-width: 100%;
  }
  th, td { border: 1px solid rgba(127,127,127,0.4); padding: 5px 10px; font-size: 13px; }
  blockquote { margin: 0.5em 0; padding: 2px 12px; border-left: 3px solid rgba(127,127,127,0.45); color: inherit; opacity: 0.85; }
  ul, ol { margin: 0.3em 0; padding-left: 1.6em; }
  li { margin: 0.15em 0; }
  img { max-width: 100%; height: auto; }
  hr { border: none; border-top: 1px solid rgba(127,127,127,0.3); margin: 1em 0; }
  .katex { font-size: 1.05em; }
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; margin: 0.5em 0; }
  .math-fallback { background: rgba(127,127,127,0.16); border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  /* 分节折叠：长讲解先看到结论，推导按需展开 */
  h2.fold-head { cursor: pointer; position: relative; padding-right: 20px; }
  h2.fold-head::after {
    content: '⌄'; position: absolute; right: 2px; top: -0.05em;
    opacity: 0.4; font-size: 0.9em; transition: transform 0.15s ease;
  }
  h2.fold-head.is-collapsed::after { transform: rotate(-90deg); }
  .fold-body.is-collapsed { display: none; }
</style>
</head>
<body class="light">
<div id="content"></div>
<script>
var md = window.markdownit({ html: false, linkify: true, breaks: true });

// 1) 先抽取公式段，避免 markdown-it 把 \( \[ 当转义符吃掉
function extractMath(text) {
  var math = [];
  function store(tex, display) {
    math.push({ tex: tex, display: display });
    return '@@MATH' + (math.length - 1) + '@@';
  }
  // 模型有时把定界符写成 \\( \\)（双反斜杠）。markdown-it 会把 \\ 还原成一个 \，
  // 于是 \( 变成普通文本、整段公式不渲染——自测题和追问建议里看到的就是这个。
  // 先把「\\ 紧跟括号」并回单反斜杠，再走正常抽取。
  text = String(text || '').replace(/\\\\([()\[\]])/g, '\\$1')
    .replace(/\$\$([\s\S]+?)\$\$/g, function(_, tex) { return store(tex, true); })
    .replace(/\\\[([\s\S]+?)\\\]/g, function(_, tex) { return store(tex, true); })
    .replace(/\\\(([\s\S]+?)\\\)/g, function(_, tex) { return store(tex, false); })
    .replace(/\$([^\$\n]+?)\$/g, function(whole, tex) {
      // 单 $ 误伤防护：内容前后带空格或纯数字（如 “$5 和 $6”）按普通文本处理
      if (/^\s|\s$/.test(tex) || /^\d+$/.test(tex)) return whole;
      return store(tex, false);
    });
  return { text: text, math: math };
}

// 2) markdown 渲染后，把占位符换回 KaTeX 渲染结果（code/pre 内不替换）
function restoreMath(html, math) {
  var parts = html.split(/(<pre[\s\S]*?<\/pre>|<code[\s\S]*?<\/code>)/g);
  return parts.map(function(part) {
    if (part.indexOf('<pre') === 0 || part.indexOf('<code') === 0) return part;
    return part.replace(/@@MATH(\d+)@@/g, function(_, i) {
      var m = math[parseInt(i, 10)];
      if (!m) return '';
      try {
        return window.katex.renderToString(m.tex, { displayMode: m.display, throwOnError: false });
      } catch (e) {
        return '<span class="math-fallback">' + m.tex.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</span>';
      }
    });
  }).join('');
}

function render(text, dark, fold, streaming) {
  document.body.className = dark ? 'dark' : 'light';
  var ex = extractMath(text);
  var html = md.render(ex.text);
  html = restoreMath(html, ex.math);
  var content = document.getElementById('content');
  content.innerHTML = html;
  if (fold) foldSections(content, streaming === true);
  reportHeight();
  // 公式字体、图片都是异步撑开的：首帧量到的高度会偏小，
  // 只报这一次的话 WebView 就停在那个高度上，回答下半截直接被裁掉
  requestAnimationFrame(reportHeight);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(reportHeight).catch(function () {});
  }
}

/**
 * 把相邻两个 h2 之间的内容包成可折叠的一节。
 *
 * 各级标题默认全部收起（用户口径：正文默认不展开），点标题按需展开。
 * streaming=true 时最后一节保持展开——它正在被写进来，收起就等于看不到当前内容；
 * 结束时（streaming=false）把最后一节也收起。
 */
function foldSections(root, streaming) {
  var heads = root.querySelectorAll('h2');
  for (var i = 0; i < heads.length; i++) {
    var h = heads[i];
    var body = document.createElement('div');
    body.className = 'fold-body';
    var node = h.nextElementSibling;
    while (node && node.tagName !== 'H2') {
      var next = node.nextElementSibling;
      body.appendChild(node);
      node = next;
    }
    if (!body.firstChild) continue;
    h.parentNode.insertBefore(body, h.nextSibling);
    h.classList.add('fold-head');
    var keepOpen = streaming && i === heads.length - 1;
    if (!keepOpen) {
      body.classList.add('is-collapsed');
      h.classList.add('is-collapsed');
    }
    (function (head, target) {
      head.addEventListener('click', function () {
        target.classList.toggle('is-collapsed');
        head.classList.toggle('is-collapsed');
        // 收起/展开会改高度，主动报一次，别等 ResizeObserver 的下一帧
        reportHeight();
      });
    })(h, body);
  }
}
window.render = render;

// 自测选项：markdown 里写成 [A. xxx](#opt:A)，点一下把选项交给原生，
// 由原生记账（选中/判对错），页面本身不跳转也不长状态
document.addEventListener('click', function (e) {
  var node = e.target;
  while (node && node !== document.body) {
    if (node.tagName === 'A') {
      var href = node.getAttribute('href') || '';
      if (href.indexOf('#opt:') === 0) {
        e.preventDefault();
        if (window.android && window.android.onOption) {
          window.android.onOption(href.slice(5));
        }
      } else if (href.indexOf('#ask:') === 0) {
        e.preventDefault();
        if (window.android && window.android.onSuggestion) {
          window.android.onSuggestion(href.slice(5));
        }
      }
      return;
    }
    node = node.parentNode;
  }
});

var lastReportedHeight = -1;
function reportHeight() {
  if (!window.android || !window.android.reportHeight) return;
  var h = document.body.scrollHeight;
  // 高度没变就不报：Compose 那边会重新测量，报一次就够
  if (Math.abs(h - lastReportedHeight) < 0.5) return;
  lastReportedHeight = h;
  window.android.reportHeight(h);
}

// 内容后续变化（图片加载完、字体回退、行内公式换行）继续跟着报
if (window.ResizeObserver) {
  new ResizeObserver(function () { reportHeight(); }).observe(document.body);
}
</script>
</body>
</html>
