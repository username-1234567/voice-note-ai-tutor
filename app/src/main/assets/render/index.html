<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="katex.min.css">
<script src="markdown-it.min.js"></script>
<script src="katex.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow-x: hidden; }
  body {
    font-family: -apple-system, "MiSans", "HarmonyOS Sans", "Noto Sans CJK SC", sans-serif;
    font-size: 14px; line-height: 1.75; word-break: break-word; overflow-wrap: break-word;
    padding: 0 2px;
  }
  body.dark { color: #E4E2DE; }
  body.light { color: #3A3630; }
  p { margin: 0.4em 0; }
  h1, h2, h3, h4, h5, h6 { margin: 0.8em 0 0.4em; line-height: 1.4; }
  h1 { font-size: 1.32em; }
  h2 { font-size: 1.2em; }
  h3 { font-size: 1.08em; }
  h4, h5, h6 { font-size: 1em; }
  pre {
    background: rgba(127,127,127,0.14); border-radius: 8px; padding: 10px 12px;
    /* 代码长行必须折行：手机上横向滚动几乎没人用，而 overflow 又会把
       整个 WebView 撑宽，右侧内容直接被裁掉。
       width/box-sizing 是必须的：只写 white-space: pre-wrap 时 pre 仍会
       被最长的不可断片段撑开，背景直接顶出屏幕 */
    box-sizing: border-box; width: 100%; max-width: 100%;
    white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;
    overflow-x: hidden; font-size: 13px; line-height: 1.5;
  }
  code { background: rgba(127,127,127,0.16); border-radius: 4px; padding: 1px 5px; font-size: 13px; overflow-wrap: anywhere; }
  pre code { background: transparent; padding: 0; }
  table {
    border-collapse: collapse; margin: 0.6em 0;
    display: block; overflow-x: auto; max-width: 100%;
  }
  th, td { border: 1px solid rgba(127,127,127,0.4); padding: 5px 10px; font-size: 13px; }
  blockquote { margin: 0.5em 0; padding: 2px 12px; border-left: 3px solid rgba(127,127,127,0.45); color: inherit; opacity: 0.85; }
  ul, ol { margin: 0.3em 0; padding-left: 1.6em; }
  li { margin: 0.15em 0; }
  img { max-width: 100%; height: auto; }
  hr { border: none; border-top: 1px solid rgba(127,127,127,0.3); margin: 1em 0; }
  .katex { font-size: 1.05em; }
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; margin: 0.5em 0; }
  .math-fallback { background: rgba(127,127,127,0.16); border-radius: 4px; padding: 1px 5px; font-size: 13px; }
</style>
</head>
<body class="light">
<div id="content"></div>
<script>
var md = window.markdownit({ html: false, linkify: true, breaks: true });

// 1) 先抽取公式段，避免 markdown-it 把 \( \[ 当转义符吃掉
function extractMath(text) {
  var math = [];
  function store(tex, display) {
    math.push({ tex: tex, display: display });
    return '@@MATH' + (math.length - 1) + '@@';
  }
  text = String(text || '')
    .replace(/\$\$([\s\S]+?)\$\$/g, function(_, tex) { return store(tex, true); })
    .replace(/\\\[([\s\S]+?)\\\]/g, function(_, tex) { return store(tex, true); })
    .replace(/\\\(([\s\S]+?)\\\)/g, function(_, tex) { return store(tex, false); })
    .replace(/\$([^\$\n]+?)\$/g, function(whole, tex) {
      // 单 $ 误伤防护：内容前后带空格或纯数字（如 “$5 和 $6”）按普通文本处理
      if (/^\s|\s$/.test(tex) || /^\d+$/.test(tex)) return whole;
      return store(tex, false);
    });
  return { text: text, math: math };
}

// 2) markdown 渲染后，把占位符换回 KaTeX 渲染结果（code/pre 内不替换）
function restoreMath(html, math) {
  var parts = html.split(/(<pre[\s\S]*?<\/pre>|<code[\s\S]*?<\/code>)/g);
  return parts.map(function(part) {
    if (part.indexOf('<pre') === 0 || part.indexOf('<code') === 0) return part;
    return part.replace(/@@MATH(\d+)@@/g, function(_, i) {
      var m = math[parseInt(i, 10)];
      if (!m) return '';
      try {
        return window.katex.renderToString(m.tex, { displayMode: m.display, throwOnError: false });
      } catch (e) {
        return '<span class="math-fallback">' + m.tex.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</span>';
      }
    });
  }).join('');
}

function render(text, dark) {
  document.body.className = dark ? 'dark' : 'light';
  var ex = extractMath(text);
  var html = md.render(ex.text);
  html = restoreMath(html, ex.math);
  document.getElementById('content').innerHTML = html;
  reportHeight();
  // 公式字体、图片都是异步撑开的：首帧量到的高度会偏小，
  // 只报这一次的话 WebView 就停在那个高度上，回答下半截直接被裁掉
  requestAnimationFrame(reportHeight);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(reportHeight).catch(function () {});
  }
}
window.render = render;

var lastReportedHeight = -1;
function reportHeight() {
  if (!window.android || !window.android.reportHeight) return;
  var h = document.body.scrollHeight;
  // 高度没变就不报：Compose 那边会重新测量，报一次就够
  if (Math.abs(h - lastReportedHeight) < 0.5) return;
  lastReportedHeight = h;
  window.android.reportHeight(h);
}

// 内容后续变化（图片加载完、字体回退、行内公式换行）继续跟着报
if (window.ResizeObserver) {
  new ResizeObserver(function () { reportHeight(); }).observe(document.body);
}
</script>
</body>
</html>
