name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # GitHub ubuntu-latest runner 已预装 Android SDK 并接受许可证，
      # 缺失的 platform/build-tools 由 AGP 自动下载。

      # 签名凭据不进仓库：keystore 以 base64 存于仓库 Secrets。
      # 注意：Secret 必须是纯 ASCII 的 base64 文本。曾经存过二进制内容，
      # GitHub 会在启动阶段直接拒绝整个工作流（startup_failure，0 个 job）。
      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE2_B64 }}" | base64 -d > "$RUNNER_TEMP/v2.jks"

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/v2.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: suitanglu-v2
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      # 已安装用户只认同一张证书：装错证书的包谁都无法覆盖安装，还会把
      # 更新链路整条切断。这里把历史发布的证书指纹钉死，不对就中断。
      - name: Verify signing certificate
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          PIN='4c7486f99e99c832d8d60cb5c25b1ee660b5c2b328752db1b791ac2398aa80b9'
          if ! grep -qi "$PIN" certs.txt; then
            echo "::error::签名证书与历史发布不一致，拒绝上传"
            exit 1
          fi

      - name: Rename APK
        run: |
          # 标签触发时是 v1.5.2；手动触发时是分支名，可能带斜杠，先压平
          NAME="$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          cp app/build/outputs/apk/release/app-release.apk "record-${NAME}.apk"
          echo "APK_NAME=record-${NAME}.apk" >> "$GITHUB_ENV"

      # 只有标签才发布；手动触发仅用于验证构建链路，不产生 Release。
      - name: Create Release and upload APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 随堂录 ${{ github.ref_name }}
          body: |
            安装包：`${{ env.APK_NAME }}`

            更新内容见 [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。
          files: ${{ env.APK_NAME }}
          draft: false
          prerelease: false
